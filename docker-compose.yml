version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dish_user
      POSTGRES_PASSWORD: dish_pass
      POSTGRES_DB: dish_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dish_user:dish_pass@db:5432/dish_platform
    depends_on:
      - db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
