services:
  - type: web
    name: yaza
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: yaza-db
          property: connectionString

databases:
  - name: yaza-db
    databaseName: dish_platform
    user: dish_user
